server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Do not advertise the exact nginx version: a scanner cross-references it
    # with a CVE list. Knowing it is nginx is unavoidable and harmless.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    # Long-cache the fingerprinted assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-included on purpose: the add_header above would otherwise discard
        # every security header inherited from the server block.
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # SPA fallback: every unknown path serves index.html so React Router (using
    # BrowserRouter) can resolve client-side routes like /hotel, /mobile, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
