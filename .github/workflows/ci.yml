name: CI

on:
  # Every push, on every branch. A branch filter here is how a repo ends up with
  # a CI that looks green because it never ran: work on a branch outside the
  # filter is pushed with nothing checking it.
  push:
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint + TypeScript + Build ─────────────────────────────────────
  build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the Prettier step below diffs against the base commit,
          # which a shallow clone does not have.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc -b --noEmit

      - name: ESLint
        run: npm run lint

      # Runs on push AND pull_request. Gating this on pull_request alone would
      # mean it never executes in a repo worked by pushing straight to a branch.
      - name: Prettier (changed files only)
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: npm run format:check

      - name: Build
        run: npm run build

  # ── Job 2: Unit tests (Vitest) ────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results/
          retention-days: 7

  # ── Job 3: E2E tests (Playwright) ─────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
