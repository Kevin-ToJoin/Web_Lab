<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>TestLab 101 — Web QA Training Platform</title>

  <!-- Open Graph. The image is a PNG on the apex domain: social crawlers skip SVGs,
       and www.tojoin.org only redirects. Absolute URLs are required by the crawlers. -->
  <meta property="og:type"         content="website" />
  <meta property="og:url"          content="https://tojoin.org/Lab101/" />
  <meta property="og:title"        content="TestLab 101 — Web QA Training Platform" />
  <meta property="og:description"  content="A professional sandbox for QA engineers. Find intentionally injected bugs across 12 web applications, from beginner to expert level." />
  <meta property="og:image"        content="https://tojoin.org/Lab101/og-image.png" />
  <meta property="og:image:type"   content="image/png" />
  <meta property="og:image:width"  content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card"        content="summary_large_image" />
  <meta name="twitter:title"       content="TestLab 101 — Web QA Training Platform" />
  <meta name="twitter:description" content="12 web apps with 290+ intentional bugs for QA training. Levels 1–10." />
  <meta name="twitter:image"       content="https://tojoin.org/Lab101/og-image.png" />
</head>
