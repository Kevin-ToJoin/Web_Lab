# Security headers for the downloadable practice image, kept in one file because
# nginx's `add_header` does NOT merge: a location block that declares any header
# of its own drops every header inherited from the server block. So this snippet
# is included again inside each location that adds one.
#
# The site is a static Vite build with no inline <script>, so script-src can be a
# plain 'self' — a per-request nonce would need a server that renders the HTML,
# and there is none here. 'unsafe-inline' stays out of script-src, which is the
# part that matters: it is what stops an injected script from ever executing.
# style-src does allow it, because the React apps style through the `style`
# attribute in 56 components.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://web-lab-lime-one.vercel.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

# Ignored over plain http (the image listens on :80), and correct the moment
# somebody puts this behind TLS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
